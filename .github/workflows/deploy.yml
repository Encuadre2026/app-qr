name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # El límite por defecto de GitHub son seis horas. Un job colgado se quedaría
    # ahí consumiendo minutos de la cuenta antes de rendirse.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Ya no se le pasa ninguna credencial al build. `VITE_ADMIN_SECRET` iba
      # aquí, y Vite incrusta las variables `VITE_*` en el paquete que descarga
      # el navegador: el secreto que abría el padrón completo viajaba dentro de
      # un archivo JavaScript público. Ahora el acceso se obtiene tecleando un
      # PIN, que el Worker canjea por un token temporal.
      #
      # `verificar` comprueba los tipos, ejecuta las pruebas, compila y revisa
      # que el paquete resultante no lleve credenciales dentro. Antes esto solo
      # compilaba: las pruebas existían y no las ejecutaba nadie, y nada miraba
      # el resultado de la compilación, que es justo donde el secreto era
      # visible. Si algo falla, no se publica.
      - name: Verificar y compilar
        run: npm run verificar
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
